name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        id: setup-sdk
        uses: android-actions/setup-android@v3

      - name: Install NDK and Build Tools
        run: |
          echo "y" | sdkmanager --install "ndk;25.2.9519653" "build-tools;33.0.1" "platforms;android-33"

      - name: Bootstrap Gradle Build Files
        run: |
          echo "include ':app'" > settings.gradle
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.vins.mobile'
              compileSdk 33

              defaultConfig {
                  applicationId "com.vins.mobile"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"

                  externalNativeBuild {
                      ndkBuild {
                          arguments "NDK_APPLICATION_MK:=../jni/Application.mk"
                      }
                  }
              }

              externalNativeBuild {
                  ndkBuild {
                      path "../jni/Android.mk"
                  }
              }

              sourceSets {
                  main {
                      manifest.srcFile '../AndroidManifest.xml'
                      java.srcDirs = ['../src']
                      res.srcDirs = ['../res']
                      assets.srcDirs = ['../assets']
                  }
              }
          }
          EOF

      - name: Setup Gradle Wrapper
        run: gradle wrapper --gradle-version 8.1.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle Wrapper
        run: ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-sdk.outputs.sdk-path }}/ndk/25.2.9519653

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VINS-Mobile-Android
          path: app/build/outputs/apk/debug/app-debug.apk
