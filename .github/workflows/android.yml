name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        id: setup-sdk
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install NDK/Build-Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "build-tools;33.0.1" "platforms;android-33"

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew
        working-directory: VINS_Mobile_AndroidPort

      - name: Build APK with Gradle Wrapper
        run: ./gradlew assembleDebug --stacktrace
        working-directory: VINS_Mobile_AndroidPort
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-sdk.outputs.sdk-path }}/ndk/25.1.8937393

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VINS-Mobile-Android
          path: VINS_Mobile_AndroidPort/app/build/outputs/apk/debug/app-debug.apk
