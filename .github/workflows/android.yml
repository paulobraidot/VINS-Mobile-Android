name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. Configurar JDK 17 PRIMERO para que sdkmanager v16.0 no falle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Iniciar setup del SDK de Android usando JDK 17
      - name: Setup Android SDK
        id: setup-sdk
        uses: android-actions/setup-android@v3

      - name: Install NDK and Build Tools
        run: |
          echo "y" | sdkmanager --install "ndk;21.4.7075588" "build-tools;30.0.3" "platforms;android-28"

      - name: Bootstrap Gradle Build Files
        run: |
          echo "include ':app'" > settings.gradle
          
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          mkdir -p app
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              compileSdkVersion 28
              defaultConfig {
                  applicationId "com.vins.mobile"
                  minSdkVersion 21
                  targetSdkVersion 28
                  versionCode 1
                  versionName "1.0"
                  externalNativeBuild {
                      ndkBuild {
                          arguments "NDK_APPLICATION_MK:=../jni/Application.mk"
                      }
                  }
              }
              externalNativeBuild {
                  ndkBuild {
                      path "../jni/Android.mk"
                  }
              }
              sourceSets {
                  main {
                      manifest.srcFile '../AndroidManifest.xml'
                      java.srcDirs = ['../src']
                      res.srcDirs = ['../res']
                      assets.srcDirs = ['../assets']
                  }
              }
          }
          EOF

      - name: Setup Gradle Wrapper
        run: gradle wrapper --gradle-version 7.5.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-sdk.outputs.sdk-path }}/ndk/21.4.7075588

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VINS-Mobile-Android
          path: app/build/outputs/apk/debug/app-debug.apk
