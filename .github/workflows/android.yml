name: Android CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout del repositorio incluyendo submódulos
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Configurar JDK 17 (requerido por AGP 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 3. Instalar NDK, CMake y herramientas de Android SDK
      - name: Install Android SDK Components & NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;23.1.7779620" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      # 4. Descargar y Configurar OpenCV Android SDK (v3.4.16)
      - name: Download & Setup OpenCV Android SDK
        run: |
          wget -q https://github.com/opencv/opencv/releases/download/3.4.16/opencv-3.4.16-android-sdk.zip -O opencv.zip
          unzip -q opencv.zip -d $GITHUB_WORKSPACE/opencv_sdk
          OPENCV_SDK_PATH="$GITHUB_WORKSPACE/opencv_sdk/OpenCV-android-sdk/sdk/native/jni"
          echo "OPENCV_SDK_PATH=$OPENCV_SDK_PATH" >> $GITHUB_ENV

      # 5. Descargar y Configurar Boost C++ Libraries (v1.63.0)
      - name: Download & Setup Boost C++ Libraries
        run: |
          curl -sSL "https://downloads.sourceforge.net/project/boost/boost/1.63.0/boost_1_63_0.tar.gz" -o boost.tar.gz
          tar -xzf boost.tar.gz -C $GITHUB_WORKSPACE
          echo "BOOST_PATH=$GITHUB_WORKSPACE/boost_1_63_0" >> $GITHUB_ENV

      # 6. Compilar Ceres Solver usando NDK-Build
      - name: Build Ceres Solver via NDK-Build
        run: |
          CERES_JNI_DIR="$GITHUB_WORKSPACE/VINS_Mobile_AndroidPort/app/libs/VINS-Mobile-master/VINS_ThirdPartyLib/ceres-solver/jni"
          if [ -d "$CERES_JNI_DIR" ]; then
            echo "APP_ABI := arm64-v8a" > "$CERES_JNI_DIR/Application.mk"
            echo "APP_STL := c++_static" >> "$CERES_JNI_DIR/Application.mk"
            echo "APP_PLATFORM := android-24" >> "$CERES_JNI_DIR/Application.mk"
            
            $ANDROID_HOME/ndk/23.1.7779620/ndk-build -C "$CERES_JNI_DIR" -j$(nproc)
          else
            echo "Error: No se encontró el directorio de Ceres Solver en $CERES_JNI_DIR"
            exit 1
          fi

      # 7. Parchear archivos build.gradle antes de invocar Gradle Wrapper
      - name: Patch Gradle Files for Modern AGP Compatibility
        working-directory: VINS_Mobile_AndroidPort
        run: |
          # Reemplazar jcenter() por google() y mavenCentral()
          find . -name "build.gradle" -exec sed -i 's/jcenter()/google()\n        mavenCentral()/g' {} +
          
          # Actualizar AGP a versión 8.0.0
          find . -name "build.gradle" -exec sed -i 's/com.android.tools.build:gradle:3.0.1/com.android.tools.build:gradle:8.0.0/g' {} +
          
          # Eliminar el atributo package del AndroidManifest legacy
          sed -i 's/package="[^"]*"//g' app/src/main/AndroidManifest.xml || true

          # Inyectar namespace requerido por AGP 8+
          NAMESPACE="com.thkoeln.jmoeller.vins_mobile_androidport"
          find . -name "build.gradle" -exec sh -c 'grep -q "^android {" "$1" && ! grep -q "namespace " "$1" && sed -i "/^android {/a\\    namespace '\''$NAMESPACE'\''" "$1"' _ {} \;

          # Actualizar sintaxis obsoleta de dependencias (compile/provided -> implementation/compileOnly)
          find . -name "build.gradle" -exec sed -i \
            -e 's/provided /compileOnly /g' \
            -e 's/compile /implementation /g' \
            -e 's/androidTestCompile/androidTestImplementation/g' \
            -e 's/testCompile/testImplementation/g' {} +

      # 8. Generar e Instalar Gradle Wrapper (Gradle 8.0)
      - name: Setup Gradle Wrapper
        working-directory: VINS_Mobile_AndroidPort
        run: |
          mkdir -p gradle/wrapper
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          gradle wrapper --gradle-version 8.0

      # 9. Configurar scripts CMake e incluir OpenCV, Boost, Ceres y Eigen
      - name: Configure CMake Build Scripts
        working-directory: VINS_Mobile_AndroidPort
        env:
          OPENCV_SDK_PATH: ${{ env.OPENCV_SDK_PATH }}
          BOOST_PATH: ${{ env.BOOST_PATH }}
        run: |
          cat << 'EOF' > app/CMakeLists.txt
          cmake_minimum_required(VERSION 3.18.1)
          project(VINS_App)

          set(CMAKE_CXX_STANDARD 14)
          add_compile_options(-Wno-format -Wno-format-security -Wno-macro-redefined -Wno-error)

          set(OpenCV_DIR "$ENV{OPENCV_SDK_PATH}" CACHE PATH "OpenCV Dir" FORCE)
          set(boost_include_dir "$ENV{BOOST_PATH}" CACHE PATH "Boost Dir" FORCE)

          find_package(OpenCV REQUIRED)

          include_directories(
              "$ENV{BOOST_PATH}"
              "${CMAKE_CURRENT_SOURCE_DIR}/libs/VINS-Mobile-master/VINS_ThirdPartyLib/eigen3"
              "${CMAKE_CURRENT_SOURCE_DIR}/libs/VINS-Mobile-master/VINS_ThirdPartyLib/ceres-solver/include"
              "${CMAKE_CURRENT_SOURCE_DIR}/libs/VINS-Mobile-master/VINS_ThirdPartyLib/ceres-solver/config"
          )

          set(CERES_LIB_DIR "${CMAKE_CURRENT_SOURCE_DIR}/libs/VINS-Mobile-master/VINS_ThirdPartyLib/ceres-solver/obj/local/${ANDROID_ABI}")
          add_library(ceres STATIC IMPORTED)
          set_target_properties(ceres PROPERTIES IMPORTED_LOCATION "${CERES_LIB_DIR}/libceres.a")

          add_subdirectory(libs/VINS-Mobile-master)
          add_subdirectory(src/main/cpp/VINS_Android)

          add_library(NativeLib SHARED src/main/cpp/jni/nativelib.cpp)

          find_library(log-lib log)

          target_link_libraries(
              NativeLib
              PRIVATE
              -Wl,--start-group
              VINS_Android
              VINSMobile
              DBoW
              DVision
              DUtils
              Loop
              Delaunay
              ceres
              ${OpenCV_LIBS}
              -Wl,--end-group
              ${log-lib}
              android
          )
          EOF

      # 10. Otorgar permisos de ejecución al ejecutable de Gradlew
      - name: Grant execute permissions to gradlew
        working-directory: VINS_Mobile_AndroidPort
        run: chmod +x ./gradlew

      # 11. Compilar APK de Release pasando variables CXX a CMake
      - name: Build Release APK
        working-directory: VINS_Mobile_AndroidPort
        env:
          ANDROID_NDK_HOME: $ANDROID_HOME/ndk/23.1.7779620
          OPENCV_SDK_PATH: ${{ env.OPENCV_SDK_PATH }}
          BOOST_PATH: ${{ env.BOOST_PATH }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.cmake.buildArguments="-DOpenCV_DIR=${OPENCV_SDK_PATH} -Dboost_include_dir=${BOOST_PATH} -DANDROID_STL=c++_static" \
            --stacktrace

      # 12. Generar y Subir Artefacto del APK
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VINS-Mobile-Android-Release
          path: VINS_Mobile_AndroidPort/app/build/outputs/apk/release/*.apk

      # 13. Subir Logs y Resultados de diagnóstico en caso de fallo
      - name: Upload Build Logs on Failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VINS-Mobile-Android-Build-Logs
          path: VINS_Mobile_AndroidPort/app/build/outputs/
